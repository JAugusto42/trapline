name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # RubyGems trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Check that the tag matches Trapline::VERSION
        run: |
          version=$(ruby -r ./lib/trapline/version -e 'print Trapline::VERSION')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Trapline::VERSION ($version). Bump lib/trapline/version.rb or tag v$version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"

      - name: Run tests
        run: bundle exec rake test

      - name: Build gem
        run: gem build trapline.gemspec

      # Same exchange as rubygems/configure-rubygems-credentials, plus `owner`:
      # RubyGems requires a gem's first push from a pending trusted publisher to
      # name the owning account, and no release of the action can pass it yet.
      - name: Get a RubyGems API key (trusted publishing)
        env:
          RUBYGEMS_OWNER_ID: "188220"
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          echo "::add-mask::$jwt"
          response=$(curl -sS --fail-with-body -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H "content-type: application/json" -H "accept: application/json" \
            -d "$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER_ID" '{jwt: $jwt, owner: $owner}')") || {
            echo "::error::Token exchange failed: $response"
            exit 1
          }
          key=$(jq -r .rubygems_api_key <<< "$response")
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Push to RubyGems
        run: gem push "trapline-$VERSION.gem"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "trapline-$VERSION.gem" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
