cwe: CWE-798
name: "Use of Hard-coded Credentials"
title: Hard-coded credentials
owasp: ["A07:2021 - Identification and Authentication Failures"]
keywords: ["hard-coded", "hardcoded", "hard coded", "default password", "default credentials", "embedded credentials"]
message: >-
  A credential appears to be hard-coded in the source. Load secrets from the
  environment or a secrets manager.
languages:
  ruby:
    rule: |
      patterns:
        - pattern-either:
            - pattern: $KEY = "$VALUE"
            - pattern: '{..., $KEY: "$VALUE", ...}'
            - pattern: '$FN(..., $KEY: "$VALUE", ...)'
        - metavariable-regex:
            metavariable: $KEY
            regex: (?i).*(passw(or)?d|secret|api_?key|access_?key|auth_?token|private_?key)
        - metavariable-regex:
            metavariable: $VALUE
            regex: .{6,}
    test: |
      # ruleid: __RULE_ID__
      password = "SuperSecret123"
      # ruleid: __RULE_ID__
      client = Client.new(api_key: "sk_live_1234567890")
      # ok: __RULE_ID__
      password = ENV.fetch("DB_PASSWORD")
      # ok: __RULE_ID__
      password = ""
  python:
    rule: |
      patterns:
        - pattern-either:
            - pattern: $KEY = "$VALUE"
            - pattern: $FN(..., $KEY="$VALUE", ...)
        - metavariable-regex:
            metavariable: $KEY
            regex: (?i).*(passw(or)?d|secret|api_?key|access_?key|auth_?token|private_?key)
        - metavariable-regex:
            metavariable: $VALUE
            regex: .{6,}
    test: |
      import os

      # ruleid: __RULE_ID__
      DB_PASSWORD = "SuperSecret123"
      # ruleid: __RULE_ID__
      client = Client(api_key="sk_live_1234567890")
      # ok: __RULE_ID__
      DB_PASSWORD = os.environ["DB_PASSWORD"]
  javascript:
    rule: |
      patterns:
        - pattern-either:
            - pattern: $KEY = "$VALUE"
            - pattern: '{..., $KEY: "$VALUE", ...}'
        - metavariable-regex:
            metavariable: $KEY
            regex: (?i).*(passw(or)?d|secret|api_?key|access_?key|auth_?token|private_?key)
        - metavariable-regex:
            metavariable: $VALUE
            regex: .{6,}
    test: |
      // ruleid: __RULE_ID__
      const password = "SuperSecret123";
      // ruleid: __RULE_ID__
      const client = new Client({ apiKey: "sk_live_1234567890" });
      // ok: __RULE_ID__
      const token = process.env.API_TOKEN;
  java:
    rule: |
      patterns:
        - pattern-either:
            - pattern: $TYPE $KEY = "$VALUE";
            - pattern: $KEY = "$VALUE";
        - metavariable-regex:
            metavariable: $KEY
            regex: (?i).*(passw(or)?d|secret|api_?key|access_?key|auth_?token|private_?key)
        - metavariable-regex:
            metavariable: $VALUE
            regex: .{6,}
    test: |
      public class Config {
          // ruleid: __RULE_ID__
          private static final String DB_PASSWORD = "SuperSecret123";
          // ok: __RULE_ID__
          private static final String DB_HOST = "db.internal";

          public String password() {
              // ok: __RULE_ID__
              String password = System.getenv("DB_PASSWORD");
              return password;
          }
      }
  go:
    rule: |
      patterns:
        - pattern-either:
            - pattern: $KEY := "$VALUE"
            - pattern: $KEY = "$VALUE"
            - pattern: const $KEY = "$VALUE"
            - pattern: var $KEY = "$VALUE"
        - metavariable-regex:
            metavariable: $KEY
            regex: (?i).*(passw(or)?d|secret|api_?key|access_?key|auth_?token|private_?key)
        - metavariable-regex:
            metavariable: $VALUE
            regex: .{6,}
    test: |
      package main

      import "os"

      // ruleid: __RULE_ID__
      const apiKey = "sk_live_1234567890"

      func connect() {
      	// ruleid: __RULE_ID__
      	password := "SuperSecret123"
      	// ok: __RULE_ID__
      	token := os.Getenv("API_TOKEN")
      	_, _ = password, token
      }
